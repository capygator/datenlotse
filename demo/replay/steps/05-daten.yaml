act: 4
title: Realitätscheck
question: Aus welchen Systemen kommen die Daten, und wo steht der zugesagte Liefertermin?
answer: Aufträge, Lieferungen und Faktura aus dem ERP, Kapazitäten aus dem MES, Kunden aus dem CRM. Den zugesagten Liefertermin kennen wir nicht, der steht nur in den E-Mails des Vertriebs.
