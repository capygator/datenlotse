[project]
name = "lotse"
version = "0.1.0"
description = "KI-gestütztes Moderationstool für die Anforderungserfassung"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.163.1",
    "jsonschema>=4.23",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
lotse = "lotse.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
